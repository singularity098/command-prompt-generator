name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Run tests (bash, zsh, fish, PowerShell)
        run: node tests/run.js
